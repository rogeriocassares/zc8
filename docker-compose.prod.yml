version: "3.8"

# Production-grade Docker Compose for zc8 Architecture
# Run with: docker-compose -f docker-compose.prod.yml up -d
# Supports local development and staging environments

services:
  # ============================================================================
  # NETWORKING LAYER - nginx Reverse Proxy (Main Entry Point)
  # ============================================================================

  nginx-main:
    image: nginx:alpine
    container_name: nginx-main
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/main.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - http-shard-0
      - http-shard-1
      - http-shard-2
    networks:
      - zc8-network
    environment:
      - TZ=UTC
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # CONTROL PLANE - Elysia API (Port 3333)
  # ============================================================================

  api:
    image: zc8-api:latest
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: zc8-api
    restart: always
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # WEB UI - Frontend Dashboard (Port 3000)
  # ============================================================================

  web:
    image: zc8-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: zc8-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REACT_APP_API_URL=https://zc8.io/api
    depends_on:
      - api
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # DATA PLANE - HTTP Transport Shards (Webhooks)
  # ============================================================================

  http-shard-0:
    image: zc8-transport:latest
    build:
      context: ./services/transport/http
      dockerfile: Dockerfile
    container_name: http-shard-0
    restart: always
    ports:
      - "8100:8100"
    environment:
      - TRANSPORT_PROTOCOL=http
      - SHARD_ID=0
      - PORT=8100
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9090
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  http-shard-1:
    image: zc8-transport:latest
    container_name: http-shard-1
    restart: always
    ports:
      - "8101:8101"
    environment:
      - TRANSPORT_PROTOCOL=http
      - SHARD_ID=1
      - PORT=8101
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9091
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  http-shard-2:
    image: zc8-transport:latest
    container_name: http-shard-2
    restart: always
    ports:
      - "8102:8102"
    environment:
      - TRANSPORT_PROTOCOL=http
      - SHARD_ID=2
      - PORT=8102
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9092
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # DATA PLANE - gRPC Transport Shards
  # ============================================================================

  grpc-shard-0:
    image: zc8-transport:latest
    container_name: grpc-shard-0
    restart: always
    ports:
      - "9100:9100"
    environment:
      - TRANSPORT_PROTOCOL=grpc
      - SHARD_ID=0
      - PORT=9100
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9190
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  grpc-shard-1:
    image: zc8-transport:latest
    container_name: grpc-shard-1
    restart: always
    ports:
      - "9101:9101"
    environment:
      - TRANSPORT_PROTOCOL=grpc
      - SHARD_ID=1
      - PORT=9101
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9191
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  grpc-shard-2:
    image: zc8-transport:latest
    container_name: grpc-shard-2
    restart: always
    ports:
      - "9102:9102"
    environment:
      - TRANSPORT_PROTOCOL=grpc
      - SHARD_ID=2
      - PORT=9102
      - DATABASE_URL=postgresql://zc8:zc8pass@postgres:5432/zc8
      - NATS_URL=nats://nats:4222
      - LOG_LEVEL=info
      - METRICS_PORT=9192
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # INGEST SERVICE - JetStream Consumer
  # ============================================================================

  ingest:
    image: zc8-ingest:latest
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: zc8-ingest
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=zc8
      - POSTGRES_PASSWORD=zc8pass
      - POSTGRES_DB=zc8
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NATS_URL=nats://nats:4222
      - NATS_STREAM_NAME=TELEMETRY
      - NATS_CONSUMER_NAME=ingest-workers
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # STORAGE - PostgreSQL Database
  # ============================================================================

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: zc8-postgres
    restart: always
    environment:
      - POSTGRES_DB=zc8
      - POSTGRES_USER=zc8
      - POSTGRES_PASSWORD=zc8pass
      - POSTGRES_INITDB_ARGS=-c max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zc8"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # STORAGE - Redis Cache
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: zc8-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # MESSAGING - NATS with JetStream
  # ============================================================================

  nats:
    image: nats:2.12.4-alpine3.22
    container_name: zc8-nats
    restart: always
    command: "-js -sd /data -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - zc8-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # STORAGE - InfluxDB3 Time-Series Database
  # ============================================================================

  influxdb:
    image: influxdb:2.7-alpine
    container_name: zc8-influxdb
    restart: always
    environment:
      - INFLUXDB_DB=zc8
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=influxpass
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - zc8-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # MONITORING - Prometheus (Optional)
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: zc8-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - zc8-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # MONITORING - Grafana (Optional)
  # ============================================================================

  grafana:
    image: grafana/grafana:latest
    container_name: zc8-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - zc8-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# VOLUMES - Persistent Storage
# ============================================================================

volumes:
  postgres-data:
  redis-data:
  nats-data:
  influxdb-data:
  prometheus-data:
  grafana-data:

# ============================================================================
# NETWORKS - Service Communication
# ============================================================================

networks:
  zc8-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
