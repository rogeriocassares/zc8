# nginx Configuration for zc8.io Main Entry Point
# Serves: API + Web UI + Webhooks
# Handles: SSL/TLS, routing, rate limiting, logging

# Upstream definitions for service discovery

upstream api_upstream {
    server api:3333 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream for HTTP Transport Shards (Webhooks)
# Uses consistent hashing to route org_id to same shard
upstream http_transport_shards {
    hash $org_id consistent;
    server http-shard-0:8100 max_fails=3 fail_timeout=30s weight=1;
    server http-shard-1:8101 max_fails=3 fail_timeout=30s weight=1;
    server http-shard-2:8102 max_fails=3 fail_timeout=30s weight=1;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

# ============================================================================
# HTTP to HTTPS Redirect
# ============================================================================

server {
    listen 80;
    server_name zc8.io *.zc8.io;
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS Main Server (zc8.io)
# ============================================================================

server {
    listen 443 ssl http2;
    server_name zc8.io;

    # SSL Configuration
    ssl_certificate /etc/nginx/certs/zc8.io.crt;
    ssl_certificate_key /etc/nginx/certs/zc8.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/zc8-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/zc8-error.log warn;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # ========================================================================
    # CONTROL PLANE: /api/* → Elysia (Port 3333)
    # ========================================================================

    location /api/ {
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy settings
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;

        # Headers for upstream connection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Connection reuse
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 4 8k;

        # WebSocket support (for future real-time APIs)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================================
    # WEB UI: /app/* → Web UI (Port 3000)
    # ========================================================================

    location /app/ {
        # Rate limiting for web
        limit_req zone=general_limit burst=10 nodelay;

        # Proxy settings
        proxy_pass http://web_upstream/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection reuse
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ========================================================================
    # DATA PLANE: /webhooks/* → HTTP Transport Shards (Consistent Hash)
    # ========================================================================

    location /webhooks/ {
        # Extract org_id from query parameter for shard routing
        set $org_id $arg_org_id;

        # If org_id not provided, return error
        if ($org_id = "") {
            return 400 '{"error": "org_id query parameter required"}';
        }

        # Rate limiting for webhooks (higher than API)
        limit_req zone=webhook_limit burst=100 nodelay;

        # Proxy settings with shard routing
        proxy_pass http://http_transport_shards;
        proxy_http_version 1.1;

        # Headers for tracing and routing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-ID $org_id;
        proxy_set_header X-Request-ID $request_id;

        # Connection reuse (important for webhooks)
        proxy_set_header Connection "";

        # Timeouts (webhooks may take longer)
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering for large payloads
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # Don't cache webhook responses
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ========================================================================
    # HEALTH CHECK Endpoint
    # ========================================================================

    location /health {
        access_log off;
        return 200 '{"status": "ok", "service": "nginx-ingress"}\n';
        add_header Content-Type application/json;
    }

    # ========================================================================
    # ROOT Route
    # ========================================================================

    location / {
        # Redirect root to /api/health
        return 301 /api/health;
    }

    # ========================================================================
    # 404 Handler
    # ========================================================================

    error_page 404 /404.json;
    location = /404.json {
        internal;
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }

    error_page 500 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        return 500 '{"error": "Internal server error"}';
        add_header Content-Type application/json;
    }
}

# ============================================================================
# HTTPS gRPC Shards (Separate Domain)
# ============================================================================

server {
    listen 50051 ssl http2;
    server_name grpc.zc8.io;

    ssl_certificate /etc/nginx/certs/zc8.io.crt;
    ssl_certificate_key /etc/nginx/certs/zc8.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/grpc-50051-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/grpc-50051-error.log warn;

    location / {
        grpc_pass grpc://grpc-shard-0:9100;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_connect_timeout 10s;
        grpc_send_timeout 60s;
        grpc_read_timeout 60s;
    }
}

server {
    listen 50052 ssl http2;
    server_name grpc.zc8.io;

    ssl_certificate /etc/nginx/certs/zc8.io.crt;
    ssl_certificate_key /etc/nginx/certs/zc8.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/grpc-50052-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/grpc-50052-error.log warn;

    location / {
        grpc_pass grpc://grpc-shard-1:9101;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_connect_timeout 10s;
        grpc_send_timeout 60s;
        grpc_read_timeout 60s;
    }
}

server {
    listen 50053 ssl http2;
    server_name grpc.zc8.io;

    ssl_certificate /etc/nginx/certs/zc8.io.crt;
    ssl_certificate_key /etc/nginx/certs/zc8.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/grpc-50053-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/grpc-50053-error.log warn;

    location / {
        grpc_pass grpc://grpc-shard-2:9102;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_connect_timeout 10s;
        grpc_send_timeout 60s;
        grpc_read_timeout 60s;
    }
}

