name: zc8-workflow
on:
  push:
    branches:
      - develop
    paths:
      - "apps/telemetry/grpc-parser/**"
      - "apps/telemetry/mqtt-to-grpc/**"
      - "apps/telemetry/chirpstackv4-rw-topic/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: grpc-parser
            context: apps/telemetry/grpc-parser
          - name: mqtt-to-grpc
            context: apps/telemetry/mqtt-to-grpc
          - name: chirpstackv4-rw-topic
            context: apps/telemetry/chirpstackv4-rw-topic

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: rogeriocassares/zc8-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
