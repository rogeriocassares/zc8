# Kubernetes Ingress and Networking Configuration
# Deploy after all-in-one.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: zc8
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zc8.io
        - api.zc8.io
        - grpc.zc8.io
      secretName: zc8-tls
  rules:
    - host: zc8.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3333
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
    - host: api.zc8.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3333
    - host: grpc.zc8.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grpc-transport
                port:
                  number: 9100

---
# Network Policies - Zero-trust networking
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: zc8
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress
  namespace: zc8
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-traffic
  namespace: zc8
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 3333

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-transport-traffic
  namespace: zc8
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - http-transport
          - grpc-transport
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 8100
        - protocol: TCP
          port: 9100

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingest-traffic
  namespace: zc8
spec:
  podSelector:
    matchLabels:
      app: ingest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - http-transport
                  - grpc-transport

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-traffic
  namespace: zc8
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api
                  - http-transport
                  - grpc-transport
                  - ingest
      ports:
        - protocol: TCP
          port: 5432

---
# Pod Disruption Budgets - High availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-pdb
  namespace: zc8
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: zc8
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest-pdb
  namespace: zc8
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingest
