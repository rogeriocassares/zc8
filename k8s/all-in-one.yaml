# Kubernetes Deployment Configuration for zc8 Option B Architecture
# Deploy with: kubectl apply -f k8s/
# Best practices: Resource requests/limits, health checks, autoscaling

apiVersion: v1
kind: Namespace
metadata:
  name: zc8
  labels:
    name: zc8

---
# ============================================================================
# CONFIGMAPS - Configuration Management
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: zc8
  labels:
    app: nginx
data:
  nginx.conf: |
    worker_processes auto;
    worker_connections 4096;

    events {
      worker_connections 4096;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      
      log_format combined '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';
      
      access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
      error_log /var/log/nginx/error.log warn;
      
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      
      upstream api_upstream {
        server api:3333 max_fails=3 fail_timeout=30s;
        keepalive 32;
      }
      
      upstream web_upstream {
        server web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
      }
      
      upstream http_transport_shards {
        hash $org_id consistent;
        server http-shard-0:8100 max_fails=3 fail_timeout=30s weight=1;
        server http-shard-1:8101 max_fails=3 fail_timeout=30s weight=1;
        server http-shard-2:8102 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
      }
      
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
      limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=1000r/s;
      
      server {
        listen 80;
        server_name _;
        
        location /health {
          access_log off;
          return 200 '{"status": "ok"}\n';
          add_header Content-Type application/json;
        }
        
        location /api/ {
          limit_req zone=api_limit burst=20 nodelay;
          proxy_pass http://api_upstream/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Connection "";
          proxy_connect_timeout 10s;
          proxy_send_timeout 30s;
          proxy_read_timeout 30s;
        }
        
        location /app/ {
          proxy_pass http://web_upstream/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Connection "";
          proxy_connect_timeout 10s;
          proxy_send_timeout 30s;
          proxy_read_timeout 30s;
        }
        
        location /webhooks/ {
          set $org_id $arg_org_id;
          if ($org_id = "") {
            return 400;
          }
          limit_req zone=webhook_limit burst=100 nodelay;
          proxy_pass http://http_transport_shards;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Org-ID $org_id;
          proxy_set_header Connection "";
          proxy_connect_timeout 10s;
          proxy_send_timeout 60s;
          proxy_read_timeout 60s;
        }
      }
    }

---
# ============================================================================
# SECRETS - Sensitive Data
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: zc8
type: Opaque
stringData:
  DATABASE_URL: postgresql://zc8:$(DB_PASSWORD)@postgres:5432/zc8
  DB_PASSWORD: change-me-in-production
  INFLUXDB_TOKEN: zc8-token-change-me

---
# ============================================================================
# SERVICES - Service Discovery
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: zc8
  labels:
    app: nginx
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: grpc-50051
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: grpc-50052
      port: 50052
      targetPort: 50052
      protocol: TCP
    - name: grpc-50053
      port: 50053
      targetPort: 50053
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zc8
  labels:
    app: api
spec:
  clusterIP: None
  selector:
    app: api
  ports:
    - port: 3333
      targetPort: 3333
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: zc8
  labels:
    app: web
spec:
  clusterIP: None
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: http-shard-0
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: http-transport
    shard: "0"
  ports:
    - port: 8100
      targetPort: 8100
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: http-shard-1
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: http-transport
    shard: "1"
  ports:
    - port: 8101
      targetPort: 8101
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: http-shard-2
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: http-transport
    shard: "2"
  ports:
    - port: 8102
      targetPort: 8102
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: grpc-shard-0
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: grpc-transport
    shard: "0"
  ports:
    - port: 9100
      targetPort: 9100
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: grpc-shard-1
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: grpc-transport
    shard: "1"
  ports:
    - port: 9101
      targetPort: 9101
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: grpc-shard-2
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: grpc-transport
    shard: "2"
  ports:
    - port: 9102
      targetPort: 9102
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: ingest

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 8222
      targetPort: 8222
      name: monitor

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zc8
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP

---
# ============================================================================
# DEPLOYMENTS - Stateless Services
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: zc8
  labels:
    app: nginx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nginx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: grpc-50051
              containerPort: 50051
            - name: grpc-50052
              containerPort: 50052
            - name: grpc-50053
              containerPort: 50053
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: logs
              mountPath: /var/log/nginx
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zc8
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: zc8-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3333"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: JWT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: zc8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: zc8-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REACT_APP_API_URL
              value: "https://zc8.io/api"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-transport
  namespace: zc8
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-transport
  template:
    metadata:
      labels:
        app: http-transport
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - http-transport
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: init-db
          image: zc8-transport:latest
          command: ["sh", "-c", 'echo "Waiting for database..."; sleep 5']
      containers:
        - name: http-transport
          image: zc8-transport:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8100
          env:
            - name: TRANSPORT_PROTOCOL
              value: "http"
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['shard-id']
            - name: PORT
              value: "8100"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 1000m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-transport
  namespace: zc8
spec:
  replicas: 3
  selector:
    matchLabels:
      app: grpc-transport
  template:
    metadata:
      labels:
        app: grpc-transport
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - grpc-transport
                topologyKey: kubernetes.io/hostname
      containers:
        - name: grpc-transport
          image: zc8-transport:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9100
          env:
            - name: TRANSPORT_PROTOCOL
              value: "grpc"
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['shard-id']
            - name: PORT
              value: "9100"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 1000m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=:9100
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/grpc_health_probe
                - -addr=:9100
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: zc8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: zc8-ingest:latest
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "zc8"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "zc8"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: NATS_STREAM_NAME
              value: "TELEMETRY"
            - name: NATS_CONSUMER_NAME
              value: "ingest-workers"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            exec:
              command: ["/bin/true"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/true"]
            initialDelaySeconds: 10
            periodSeconds: 5

---
# ============================================================================
# STATEFULSETS - Stateful Services (Databases)
# ============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: zc8
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.12.4-alpine3.22
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: nats-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: zc8
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.1-alpine3.23
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: zc8
            - name: POSTGRES_USER
              value: zc8
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U zc8
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
# ============================================================================
# HORIZONTAL POD AUTOSCALING
# ============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: zc8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: http-transport-hpa
  namespace: zc8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: http-transport
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grpc-transport-hpa
  namespace: zc8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grpc-transport
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
