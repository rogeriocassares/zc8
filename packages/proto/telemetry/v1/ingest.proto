// telemetry/v1/ingest.proto
//
// Unified protobuf schema for the zc8 telemetry platform.
//
// JetStream subject map (all messages are persisted — no NATS Core):
//
//   data.{orgId}.{teamId}.{deviceKey}.raw      – IngestEnvelope (type=PAYLOAD_RAW)
//   data.{orgId}.{teamId}.{deviceKey}.decoded  – IngestEnvelope (type=PAYLOAD_DECODED)
//   svc.{orgId}.{svcId}                        – ServiceEvent
//   cmd.{orgId}.{teamId}.{deviceKey}           – CommandEnvelope
//
// Three JetStream streams:
//   DATA  – captures data.>
//   SVC   – captures svc.>
//   CMD   – captures cmd.>
//
// Browser consumers use ephemeral ordered JetStream consumers via nats.ws.
// Browser NATS permissions: subscribe data.{orgId}.> and svc.{orgId}.>

syntax = "proto3";

option go_package = "github.com/rogeriocassares/zc8/packages/proto/telemetry/v1";

package zc8_telemetry_proto_v1;

import "google/protobuf/timestamp.proto";

// ─── Enumerations ─────────────────────────────────────────────────────────────

enum IngestSource {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MQTT        = 1;
  SOURCE_GRPC        = 2;
  SOURCE_HTTP        = 3;
  SOURCE_CLI         = 4;
}

enum PayloadType {
  PAYLOAD_UNSPECIFIED = 0;
  PAYLOAD_RAW         = 1; // Raw bytes from device – primary for audit log
  PAYLOAD_DECODED     = 2; // Parsed + enriched – streamed to all output services
}

enum ValueType {
  VALUE_UNSPECIFIED = 0;
  VALUE_FLOAT       = 1;
  VALUE_INT         = 2;
  VALUE_BOOL        = 3;
}

enum ServiceEventType {
  SVC_EVENT_UNSPECIFIED = 0;
  SVC_HEARTBEAT         = 1; // Adapter alive
  SVC_TOMBSTONE         = 2; // Adapter stopped
  SVC_RAW_INGEST        = 3; // Raw message received (before parsing)
  SVC_OUTPUT_ACK        = 4; // Output service wrote records
}

// ─── Device context (resolved from LRU → Redis → Postgres) ───────────────────

// DeviceTags carries physical location and asset classification.
// Resolved at the transport layer and forwarded as InfluxDB tags on every
// decoded payload — no Postgres join on the hot path.
message DeviceTags {
  double latitude      = 1;
  double longitude     = 2;
  double altitude_m    = 3;
  string location_name = 4;
  string asset_id      = 5; // arbitrary asset identifier
  string category      = 6; // "energy" | "water" | "hvac" | "environment" | …
  map<string, string> extra = 7; // additional custom tags
}

// SensorCalibration — linear correction for one sensor type.
// calibrated = raw * scale + offset
message SensorCalibration {
  string sensor_type = 1;
  double scale       = 2; // default 1.0  (no correction)
  double offset      = 3; // default 0.0
  string unit        = 4;
}

// DeviceContext is resolved once at the transport layer and attached to every
// IngestEnvelope, eliminating per-message DB lookups on the hot path.
message DeviceContext {
  uint64 device_key        = 1;
  int64  organization_id   = 2;
  int64  team_id           = 3;
  string device_id         = 4; // UUID from devices table
  string device_model_code = 5;
  int64  vendor_id         = 6;
  uint32 parser_id         = 7; // Binary parser id

  DeviceTags               tags         = 8;
  repeated SensorCalibration calibrations = 9;
}

// ─── IngestEnvelope — top-level JetStream message ────────────────────────────
//
//  Published to data.{orgId}.{teamId}.{deviceKey}.raw    (PayloadType=PAYLOAD_RAW)
//          or   data.{orgId}.{teamId}.{deviceKey}.decoded (PayloadType=PAYLOAD_DECODED)
//
// All output services subscribe to data.{orgId}.>.decoded (or data.> for global
// services).  The raw subject is consumed primarily by audit-log services
// (InfluxDB3 / ClickHouse), but any output service may also subscribe to it.

message IngestEnvelope {
  string                    event_id  = 1; // ULID — idempotency key
  google.protobuf.Timestamp ts        = 2; // Event timestamp (device time when available)
  google.protobuf.Timestamp ingest_ts = 3; // Wall-clock time at transport layer
  IngestSource              source    = 4;
  PayloadType               type      = 5;
  uint64                    device_key = 6;

  DeviceContext context = 7;

  oneof payload {
    RawPayload     raw     = 8;
    DecodedPayload decoded = 9;
  }
}

// ─── RawPayload ───────────────────────────────────────────────────────────────
// Audit log: one record per incoming device message, pre-parse.

message RawPayload {
  bytes  data         = 1; // Raw bytes as received
  string source_topic = 2; // MQTT topic / HTTP path / gRPC method
  int64  service_id   = 3; // Input service (services.id)
  string gateway_eui  = 4; // LoRaWAN gateway EUI (optional)
  int32  rssi         = 5; // Signal strength dBm (optional)
  float  snr          = 6; // Signal-to-noise ratio dB (optional)
}

// ─── DecodedPayload ───────────────────────────────────────────────────────────
// Parsed + enriched output for all consumers.
//
// InfluxDB3 sensor_data measurement layout:
//   tags:   org_id, team_id, device_key, model_code, vendor_id,
//           location_name, asset_id, category, <extra_tags>, sensor_type
//   fields: value_float | value_int | value_bool, value_type, scale, offset,
//           calibrated_value, unit
//   time:   ts
//
// InfluxDB3 sensor_calibration measurement layout (snapshot at write time):
//   tags:   org_id, team_id, device_key, sensor_type
//   fields: scale, offset, unit

message SensorField {
  string    sensor_type     = 1; // e.g. "a_plus", "p_total", "temperature"
  ValueType value_type      = 2; // discriminator for query / UI

  // Exactly one is populated (matching value_type)
  double    value_float     = 3;
  int64     value_int       = 4;
  bool      value_bool      = 5;

  // Calibration snapshot at time of write
  double    scale           = 6; // default 1.0
  double    offset          = 7; // default 0.0
  // Pre-computed: calibrated = value_float * scale + offset
  double    calibrated_value = 8;

  string    unit            = 9;
}

message DecodedPayload {
  // InfluxDB3 measurement name (default: "sensor_data")
  string measurement = 1;

  // Identity tags (written as InfluxDB tags)
  string org_id     = 2;
  string team_id    = 3;
  string device_key = 4;
  string model_code = 5;
  string vendor_id  = 6;

  // Location tags
  double latitude      = 7;
  double longitude     = 8;
  double altitude_m    = 9;
  string location_name = 10;

  // Asset tags
  string asset_id  = 11;
  string category  = 12;

  // Custom extra tags
  map<string, string> extra_tags = 13;

  // Sensor readings — one per sensor type in this message
  repeated SensorField fields = 14;

  // Input service that produced this decoded payload
  int64 service_id = 15;
}

// ─── ServiceEvent — heartbeat / raw-ingest / output-ack ──────────────────────
//
// Published to: svc.{orgId}.{svcId}
// All event types share this message; event_type discriminates.

message ServiceEvent {
  ServiceEventType          event_type    = 1;
  int64                     service_id    = 2;
  string                    service_type  = 3; // e.g. "input.mqtt"
  int64                     org_id        = 4;
  int64                     team_id       = 5;
  string                    team_name     = 6;
  google.protobuf.Timestamp reported_at   = 7;

  // SVC_HEARTBEAT / SVC_TOMBSTONE fields
  bool    is_connected  = 8;
  bool    is_running    = 9;
  int64   message_count = 10;
  int64   error_count   = 11;
  google.protobuf.Timestamp last_message_at = 12;
  string  broker        = 13; // MQTT broker / InfluxDB host / gRPC endpoint
  repeated string topics = 14; // MQTT subscribed topics

  // SVC_RAW_INGEST fields (input adapters only)
  uint64 device_key     = 15;
  string source_topic   = 16;
  bytes  payload_preview = 17; // First 64 bytes
  int32  payload_size   = 18;

  // SVC_OUTPUT_ACK fields (output adapters only)
  int32  records_written = 19;
  string target          = 20; // InfluxDB bucket / MQTT topic / HTTP endpoint
}

// ─── Command messages ─────────────────────────────────────────────────────────
//
// Published to: cmd.{orgId}.{teamId}.{deviceKey}

message CommandEnvelope {
  string command_id    = 1;
  string device_id     = 2; // UUID
  uint64 device_key    = 3;
  string dev_eui       = 4; // LoRaWAN EUI (optional)

  string command_type  = 5; // "downlink_raw" | "reboot" | "set_config"
  bytes  payload       = 6; // JSON-encoded command data

  // Transport routing (pre-resolved — no DB lookup on dispatch path)
  string transport_type       = 7; // "mqtt" | "http" | "grpc"
  string lns_provider_code    = 8;
  string formatter_code       = 9;

  // MQTT
  string mqtt_host      = 10;
  int32  mqtt_port      = 11;
  string mqtt_username  = 12;
  string mqtt_password  = 13;
  int32  mqtt_qos       = 14;
  bool   mqtt_use_tls   = 15;

  // HTTP
  string http_base_url         = 16;
  string http_method           = 17;
  string http_auth_type        = 18;
  string http_auth_credentials = 19;
  int32  http_timeout_sec      = 20;
  string http_content_type     = 21;

  // gRPC
  string grpc_host         = 22;
  int32  grpc_port         = 23;
  string grpc_service_name = 24;

  // Context
  int64  organization_id   = 25;
  int64  team_id           = 26;
  string device_model_code = 27;
  string vendor_code       = 28;
  bytes  device_metadata   = 29; // JSON

  // Timing
  google.protobuf.Timestamp created_at  = 30;
  google.protobuf.Timestamp expires_at  = 31;
  int32  max_attempts = 32;
  int32  attempt      = 33;
}

message CommandAck {
  string                    command_id       = 1;
  string                    device_id        = 2;
  bool                      success          = 3;
  string                    error            = 4;
  google.protobuf.Timestamp acknowledged_at  = 5;
}

// ─── gRPC services ────────────────────────────────────────────────────────────

// TelemetryIngestService — for direct gRPC input adapters.
service TelemetryIngestService {
  rpc IngestUnary(IngestEnvelope)         returns (IngestAck);
  rpc IngestStream(stream IngestEnvelope) returns (stream IngestAck);
  rpc IngestBatch(IngestBatchRequest)     returns (IngestBatchAck);
}

message IngestAck {
  string                    event_id    = 1;
  google.protobuf.Timestamp ingest_time = 2;
  bool                      accepted    = 3;
  string                    reason      = 4; // non-empty on rejection
}

message IngestBatchRequest {
  repeated IngestEnvelope envelopes = 1;
}

message IngestBatchAck {
  repeated IngestAck acks     = 1;
  int32              accepted = 2;
  int32              rejected = 3;
}

// CommandService — bidirectional between API and command dispatch workers.
service CommandService {
  rpc SendCommand(CommandEnvelope)                         returns (CommandAck);
  rpc CommandStream(stream CommandEnvelope) returns (stream CommandAck);
}
