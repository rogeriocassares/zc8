syntax = "proto3";

option go_package = "github.com/rogeriocassares/zc8/packages/proto/telemetry/v1";

package zc8_telemetry_proto_v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// TelemetryIngestService provides RPCs for ingesting telemetry data from devices.
service TelemetryIngestService {
  // Ingest accepts a single ingest request and returns a response with the ingest status.
  rpc Ingest(IngestRequest) returns (IngestResponse);
  // IngestStream accepts a stream of ingest requests and returns a single response.
  rpc IngestStream(stream IngestRequest) returns (IngestResponse);
}

// CommandService provides RPCs for sending commands to devices.
service CommandService {
  // SendCommand sends a command to a device and returns the command ID.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // AcknowledgeCommand acknowledges receipt of a command on the device.
  rpc AcknowledgeCommand(AcknowledgeCommandRequest)
      returns (AcknowledgeCommandResponse);
}

enum IngestSource {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MQTT = 1;
  SOURCE_GRPC = 2;
  SOURCE_CLI = 3;
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_OK = 1;
  INGEST_DUPLICATE = 2;
  INGEST_REJECTED = 3;
  INGEST_BACKPRESSURE = 4;
  INGEST_INVALID = 5;
}

message IngestRequest {
  string event_id = 1; 
  string device_id = 2;
  bytes payload = 3;
  google.protobuf.Timestamp timestamp = 4;
  IngestSource source = 5;
}

message IngestResponse {
  IngestStatus status = 1;
  string event_id = 2;
  string reason = 3;
}


// PROTOBUF OVER NATS SUBJECT DESIGN
message TelemetryUpdate {
  string event_id = 1;
  string organization_id = 2;
  string device_id = 3;
  google.protobuf.Timestamp timestamp = 4; // optional
  repeated SensorValue sensors_values = 5;
}

message SensorValue {
  string sensor_type = 1;
  double value = 3;
  string unit = 4;
}

enum DeviceStatus {
  UNKNOWN = 0;
  ONLINE = 1;
  OFFLINE = 2;
  DEGRADED = 3;
}

message DeviceState {
  string organization_id = 1;
  string device_id = 2;
  DeviceStatus status = 3;
  int64 last_seen = 4;

  string firmware_version = 5;
  repeated string sensors = 6;

  map<string, string> metadata = 7;
}




// Embedded message for devices that support Protobuf
message DeviceData {
  uint64 timestamp = 1;

  oneof data {
    CAN can = 2;
    IMU  imu = 3;
    GPS gps = 4;
  }
}

message CAN {
  uint32 id = 1;
  bytes data = 2; // 8-byte CAN payload
}

message IMU {
  float ax = 1; // acceleration
  float ay = 2;
  float az = 3;
  float gx = 4; // gyroscope
  float gy = 5;
  float gz = 6;
  float r = 7; // euler orientation
  float p = 8;
  float y = 9;
}

message GPS {
  double latitude = 1;
  double longitude = 2;
  float altitude = 3;
  float speed = 4;
}

message SendCommandRequest {
  string device_id = 1;
  google.protobuf.Any command_data = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message SendCommandResponse {
  bool success = 1;
  string command_id = 2;
  string error = 3;
}

message AcknowledgeCommandRequest {
  string command_id = 1;
  string device_id = 2;
  google.protobuf.Timestamp received_at = 3;
}

message AcknowledgeCommandResponse {
  bool success = 1;
  string message = 2;
}

// Breakdown of the Example
// The provided .proto file defines two gRPC services for sensor communication:
// TelemetryService (data from sensors) and CommandService (data to sensors),
// following protocol buffer best practices.//

// TelemetryService
// GetSensorData: Unary RPC to request sensor readings.
// Request: GetSensorDataRequest (sensor ID and optional timestamp).
// Response: GetSensorDataResponse (list of SensorReading and status).
// StreamTelemetry: Server-streaming RPC for continuous telemetry.
// Request: StreamTelemetryRequest (sensor ID).
// Response: Stream of TelemetryData messages.
// CommandService
// SendCommand: Unary RPC to send a command to a sensor.
// Request: SendCommandRequest (command type, parameters, target).
// Response: SendCommandResponse (success flag, message, command ID).
// AcknowledgeCommand: RPC to confirm command receipt.
// Request: AcknowledgeCommandRequest (command ID).
// Response: google.protobuf.Empty (no content).
// Message Design
// All messages use CamelCase.
// Fields use lower_snake_case.
// Reusable types like SensorReading and TelemetryData encapsulate structured
// data. Using google.protobuf.Empty allows future expansion (e.g., adding
// metadata)
