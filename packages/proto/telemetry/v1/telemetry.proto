syntax = "proto3";

option go_package = "github.com/rogeriocassares/zc8/packages/proto/telemetry/v1";

package zc8_telemetry_proto_v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

service TelemetryService {
  rpc IngestTelemetry(IngestTelemetryRequest) returns (IngestTelemetryResponse);
  rpc StreamTelemetry(stream IngestTelemetryRequest)
      returns (IngestTelemetryResponse);
}

service CommandService {
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  rpc AcknowledgeCommand(AcknowledgeCommandRequest)
      returns (AcknowledgeCommandResponse);
}

message IngestTelemetryRequest {
  string device_id = 1;
  bytes data = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message IngestTelemetryResponse {
  bool success = 1;
  string message_id = 2;
  string error = 3;
}

// Embedded message for devices that support Protobuf
message TelemetryData {
  uint64 timestamp = 1;

  oneof data {
    CANFrame can = 2;
    IMUData  imu = 3;
    GPSData  gps = 4;
  }
}

message CANFrame {
  uint32 id = 1;
  bytes data = 2; // 8-byte CAN payload
}

message IMUData {
  float ax = 1; // acceleration
  float ay = 2;
  float az = 3;
  float gx = 4; // gyroscope
  float gy = 5;
  float gz = 6;
  float r = 7; // euler orientation
  float p = 8;
  float y = 9;
}

message GPSData {
  double latitude = 1;
  double longitude = 2;
  float altitude = 3;
  float speed = 4;
}

message SendCommandRequest {
  string device_id = 1;
  google.protobuf.Any command_data = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message SendCommandResponse {
  bool success = 1;
  string command_id = 2;
  string error = 3;
}

message AcknowledgeCommandRequest {
  string command_id = 1;
  string device_id = 2;
  google.protobuf.Timestamp received_at = 3;
}

message AcknowledgeCommandResponse {
  bool success = 1;
  string message = 2;
}
// Breakdown of the Example
// The provided .proto file defines two gRPC services for sensor communication:
// TelemetryService (data from sensors) and CommandService (data to sensors),
// following protocol buffer best practices.//

// TelemetryService
// GetSensorData: Unary RPC to request sensor readings.
// Request: GetSensorDataRequest (sensor ID and optional timestamp).
// Response: GetSensorDataResponse (list of SensorReading and status).
// StreamTelemetry: Server-streaming RPC for continuous telemetry.
// Request: StreamTelemetryRequest (sensor ID).
// Response: Stream of TelemetryData messages.
// CommandService
// SendCommand: Unary RPC to send a command to a sensor.
// Request: SendCommandRequest (command type, parameters, target).
// Response: SendCommandResponse (success flag, message, command ID).
// AcknowledgeCommand: RPC to confirm command receipt.
// Request: AcknowledgeCommandRequest (command ID).
// Response: google.protobuf.Empty (no content).
// Message Design
// All messages use CamelCase.
// Fields use lower_snake_case.
// Reusable types like SensorReading and TelemetryData encapsulate structured
// data. Using google.protobuf.Empty allows future expansion (e.g., adding
// metadata)
